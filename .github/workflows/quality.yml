name: Качество

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-nesting:
    name: Чистая сборка ядра в Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Языковая проверка
        run: python3 tools/run_checks.py language
      - name: Архитектурные проверки
        run: python3 tools/run_checks.py architecture
      - name: Настройка, сборка и тестирование
        run: python3 tools/run_checks.py nesting

  windows-headless:
    name: Сборка MSVC без графического интерфейса
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Языковая проверка
        run: py -3 tools/run_checks.py language
      - name: Архитектурные проверки
        run: py -3 tools/run_checks.py architecture
      - name: Настройка, сборка и тестирование
        run: py -3 tools/run_checks.py headless

  python:
    name: Python 3.13
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка пакета и тестовых зависимостей
        run: python -m pip install -e ".[dev]"
      - name: Языковая проверка
        run: python tools/run_checks.py language
      - name: Архитектурные проверки
        run: python tools/run_checks.py architecture
      - name: Тесты Python
        run: python tools/run_checks.py python

name: Качество

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-nesting:
    name: Чистая сборка ядра в Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Проверка документации
        run: python3 tools/run_checks.py documentation
      - name: Языковая проверка
        run: python3 tools/run_checks.py language
      - name: Архитектурные проверки
        run: python3 tools/run_checks.py architecture
      - name: Настройка, сборка и тестирование
        run: python3 tools/run_checks.py nesting

  windows-headless:
    name: Сборка MSVC без графического интерфейса
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Проверка документации
        run: py -3 tools/run_checks.py documentation
      - name: Языковая проверка
        run: py -3 tools/run_checks.py language
      - name: Архитектурные проверки
        run: py -3 tools/run_checks.py architecture
      - name: Настройка, сборка и тестирование
        run: py -3 tools/run_checks.py headless

  windows-desktop:
    name: Настольное приложение Windows, ${{ matrix.name }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: без ONNX
            check: desktop-no-onnx
          - name: с ONNX
            check: desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Сборка и тестирование
        shell: pwsh
        run: py -3 tools/run_checks.py ${{ matrix.check }} --qt-dir "$env:QT_ROOT_DIR/lib/cmake/Qt6"

  linux-sanitized:
    name: Ядро Linux с проверкой памяти и неопределённого поведения
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - name: Настройка, сборка и тестирование
        run: |
          cmake --preset linux-nesting-sanitized
          cmake --build --preset build-linux-nesting-sanitized --parallel 2
          ctest --test-dir build/linux-nesting-sanitized -C Debug --output-on-failure

  python:
    name: Python 3.13
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Проверка документации
        run: python tools/run_checks.py documentation
      - name: Установка пакета и тестовых зависимостей
        run: python -m pip install -e ".[dev]"
      - name: Языковая проверка
        run: python tools/run_checks.py language
      - name: Архитектурные проверки
        run: python tools/run_checks.py architecture
      - name: Тесты Python
        run: python tools/run_checks.py python

[build-system]
requires = [
  "scikit-build-core==1.0.3",
  "pybind11==3.1.0",
  "numpy==2.5.3",
]
build-backend = "scikit_build_core.build"

[project]
name = "aipackaging-ml"
version = "0.2.0"
description = "Обучаемая клеточная среда и воспроизводимые датасеты AIPackaging"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy==2.5.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.scikit-build]
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/aipackaging_ml"]
cmake.args = [
  "-DBUILD_DESKTOP=OFF",
  "-DBUILD_SOLVER_CLI=OFF",
  "-DBUILD_TESTS=OFF",
  "-DBUILD_PYTHON_BINDINGS=ON",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra --basetemp=build/pytest-temp"
